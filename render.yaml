services:
  - type: web
    name: aegisbuff
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENDOTA_API_URL
        value: https://api.opendota.com/api
      - key: OPENDOTA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VITE_API_URL
        value: ''
